# Common configuration for all boards
# Board-specific settings (BLE, PWM, etc.) are in boards/<board_name>.conf

# USB configuration
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_MANUFACTURER="Numa Society"

# Logging/debug defaults: keep disabled in normal firmware.
# For scan-rate revalidation, temporarily enable:
# 1) CONFIG_LOG=y
# 2) CONFIG_LOG_DEFAULT_LEVEL=3
# 3) CONFIG_ZMK_USB_LOGGING=y
# 4) CONFIG_TITAN8000_KSCAN_DEBUG_SCAN_RATE=y
# Optionally tune:
# - CONFIG_TITAN8000_KSCAN_DEBUG_SCAN_RATE_INTERVAL_MS=1000
# - CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
# (and ensure USB logging snippet/setup is applied per ZMK docs)
#CONFIG_LOG=y
#CONFIG_LOG_DEFAULT_LEVEL=3
#CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

# ZMK STUDIO settings
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_KEYBOARD_NAME="Titan 8000"

CONFIG_TITAN8000_KSCAN_WAIT_BEFORE_INPUTS_US=20
#CONFIG_TITAN8000_KSCAN_WAIT_BETWEEN_OUTPUTS_US=1
#CONFIG_TITAN8000_KSCAN_DEBUG_SCAN_RATE=y
#CONFIG_TITAN8000_KSCAN_DEBUG_SCAN_RATE_INTERVAL_MS=1000

#CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=20
#CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=2
