# Common configuration for all boards
# Board-specific settings (BLE, PWM, etc.) are in boards/<board_name>.conf

# USB configuration
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_MANUFACTURER="Numa Society"

# LOG settings (minimal for both boards)
#CONFIG_LOG=y
#CONFIG_LOG_DEFAULT_LEVEL=2

# ZMK STUDIO settings
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_KEYBOARD_NAME="Titan 8000"

CONFIG_TITAN8000_KSCAN_WAIT_BEFORE_INPUTS_US=10
#CONFIG_TITAN8000_KSCAN_WAIT_BETWEEN_OUTPUTS_US=1

#CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=20
#CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=2
